[pytest]
# Projektwurzel in sys.path aufnehmen, damit "from app...." in den Tests
# funktioniert - unabhaengig davon, WIE pytest gestartet wird.
#
# Hintergrund: "python -m pytest" stellt das aktuelle Verzeichnis automatisch
# an den Anfang von sys.path, das Konsolenskript "pytest" aber nicht. Ohne
# diese Zeile laufen die Tests lokal (python -m pytest) und scheitern in CI
# (pytest) mit "ModuleNotFoundError: No module named 'app'".
pythonpath = .

# Nur test_*.py einsammeln. Ohne das greift zusaetzlich pytests zweites
# Default-Muster "*_test.py" - und damit wuerde smoke_test.py im Wurzel-
# verzeichnis mit importiert. Das ist kein pytest-Modul, sondern ein
# eigenstaendiges Skript (startet einen eigenen uvicorn) und laeuft im
# Workflow als separater Schritt via "python smoke_test.py".
python_files = test_*.py

testpaths = tests
